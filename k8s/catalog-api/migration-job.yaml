apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-api-migration
  namespace: fiap-cloud-games
  labels:
    app: catalog-api
    job: catalog-api-migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: catalog-api
        job: catalog-api-migration
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SQLCMDPASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-sqlserver-secret
                  key: MSSQL_SA_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              sqlcmd=/opt/mssql-tools18/bin/sqlcmd
              if [ ! -x "$sqlcmd" ]; then
                sqlcmd=/opt/mssql-tools/bin/sqlcmd
              fi
              if [ ! -x "$sqlcmd" ]; then
                echo "sqlcmd nao encontrado na imagem." >&2
                exit 1
              fi
              echo "Aguardando SQL Server aceitar consultas..."
              until "$sqlcmd" -S catalog-sqlserver,1433 -U sa -d master -C -b -l 3 -t 3 -Q "SELECT 1" >/dev/null 2>&1; do
                sleep 2
              done
              echo "SQL Server disponivel; iniciando migrations."
      containers:
        - name: catalog-api-migration
          image: maicaoxd/fiap-cloud-games-catalog-api:0.4.1
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "CatalogAPI.dll", "--migrate"]
          envFrom:
            - configMapRef:
                name: catalog-api-configmap
            - secretRef:
                name: catalog-api-secret
          env:
            - name: Redis__Enabled
              value: "false"
            - name: MongoDb__Password
              valueFrom:
                secretKeyRef:
                  name: catalog-mongodb-secret
                  key: FCG_MONGODB_PASSWORD
