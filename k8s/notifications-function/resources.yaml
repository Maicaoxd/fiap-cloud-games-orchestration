apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-function-configmap
  namespace: fiap-cloud-games
data:
  FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
  UserCreatedQueue: notifications-user-created-event
  PaymentProcessedQueue: notifications-payment-processed-event
  AzureWebJobs.UserCreatedFunction.Disabled: "false"
  AzureWebJobs.PaymentProcessedFunction.Disabled: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: notifications-function-secret
  namespace: fiap-cloud-games
type: Opaque
stringData:
  # Credenciais acadêmicas locais; a chave de armazenamento pertence ao emulador.
  RabbitMQConnection: "amqp://guest:guest@rabbitmq:5672/%2F"
  AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=fcglocal;AccountKey=ZmlhcC1jbG91ZC1nYW1lcy1sb2NhbC1zdG9yYWdlLWtleQ==;BlobEndpoint=http://azurite:10000/fcglocal;QueueEndpoint=http://azurite:10001/fcglocal;TableEndpoint=http://azurite:10002/fcglocal"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-function
  namespace: fiap-cloud-games
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notifications-function
  template:
    metadata:
      labels:
        app: notifications-function
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-azurite
          image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
          imagePullPolicy: IfNotPresent
          command:
            - pwsh
            - -NoProfile
            - -Command
            - |
              $ErrorActionPreference = 'Stop'
              for ($attempt = 1; $attempt -le 120; $attempt++) {
                try {
                  foreach ($port in @(10000, 10001, 10002)) {
                    $client = [Net.Sockets.TcpClient]::new()
                    try { $client.ConnectAsync('azurite', $port).WaitAsync([TimeSpan]::FromSeconds(2)).GetAwaiter().GetResult() }
                    finally { $client.Dispose() }
                  }
                  Write-Host 'Azurite disponível; preparando as filas de notificação.'
                  exit 0
                }
                catch { Start-Sleep -Seconds 2 }
              }
              [Console]::Error.WriteLine('Azurite indisponível após aguardar a inicialização.')
              exit 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: configure-rabbitmq
          image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
          imagePullPolicy: IfNotPresent
          command: [pwsh, -NoProfile, -File, /scripts/configure-rabbitmq.ps1]
          env:
            - name: RABBITMQ_ADMIN_URL
              value: http://rabbitmq:15672
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      containers:
        - name: notifications-function
          image: maicaoxd/fiap-cloud-games-notifications-function:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: notifications-function-configmap
            - secretRef:
                name: notifications-function-secret
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 120
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
      volumes:
        - name: scripts
          configMap:
            name: rabbitmq-notifications-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-function
  namespace: fiap-cloud-games
spec:
  type: ClusterIP
  selector:
    app: notifications-function
  ports:
    - name: http
      port: 80
      targetPort: http
