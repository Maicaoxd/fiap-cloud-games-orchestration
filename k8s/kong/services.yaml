apiVersion: v1
kind: Service
metadata:
  name: kong-admin
  namespace: fiap-cloud-games
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: admin
      port: 8001
      targetPort: admin
---
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: fiap-cloud-games
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: proxy
      nodePort: 30080
