apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiap-cloud-games
configMapGenerator:
  - name: loki-config
    files:
      - config.yml=loki/docker.yml
  - name: alloy-config
    files:
      - config.alloy=alloy/kubernetes.alloy
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/kubernetes.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=grafana/provisioning/datasources/prometheus.yml
      - loki.yml=grafana/provisioning/datasources/loki.yml
  - name: grafana-providers
    files:
      - fcg.yml=grafana/provisioning/dashboards/fcg.yml
  - name: grafana-dashboards
    files:
      - fcg-apis.json=grafana/dashboards/fcg-apis.json
      - fcg-logs.json=grafana/dashboards/fcg-logs.json
