apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fiap-cloud-games
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/kubernetes.yml
  - name: grafana-datasources
    files:
      - prometheus.yml=grafana/provisioning/datasources/prometheus.yml
  - name: grafana-providers
    files:
      - fcg.yml=grafana/provisioning/dashboards/fcg.yml
  - name: grafana-dashboards
    files:
      - fcg-apis.json=grafana/dashboards/fcg-apis.json
