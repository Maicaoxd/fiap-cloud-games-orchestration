services:
  rabbitmq-topology:
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    command: ["pwsh", "-NoProfile", "-File", "/config/configure-rabbitmq.ps1"]
    environment:
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    volumes:
      - ../fiap-cloud-games-notifications-function/rabbitmq:/config:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --location /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --disableProductStyleUrl
    environment:
      AZURITE_ACCOUNTS: "fcglocal:ZmlhcC1jbG91ZC1nYW1lcy1sb2NhbC1zdG9yYWdlLWtleQ=="
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(10000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fcg-network

  notifications-function:
    build:
      context: ../fiap-cloud-games-notifications-function
      dockerfile: Dockerfile
    image: maicaoxd/fiap-cloud-games-notifications-function:0.1.0
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=fcglocal;AccountKey=ZmlhcC1jbG91ZC1nYW1lcy1sb2NhbC1zdG9yYWdlLWtleQ==;BlobEndpoint=http://azurite:10000/fcglocal;QueueEndpoint=http://azurite:10001/fcglocal;TableEndpoint=http://azurite:10002/fcglocal"
      RabbitMQConnection: "amqp://guest:guest@rabbitmq:5672/%2F"
      UserCreatedQueue: notifications-user-created-event
      PaymentProcessedQueue: notifications-payment-processed-event
      AzureWebJobs.UserCreatedFunction.Disabled: "false"
      AzureWebJobs.PaymentProcessedFunction.Disabled: "false"
    depends_on:
      rabbitmq-topology:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - fcg-network

  catalog-redis:
    image: redis:8.2.9-alpine
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      FCG_REDIS_PASSWORD: "${FCG_REDIS_PASSWORD:-fcg-local-redis}"
    command:
      - /bin/sh
      - -ec
      - exec redis-server --requirepass "$$FCG_REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(REDISCLI_AUTH=\"$$FCG_REDIS_PASSWORD\" redis-cli ping)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  catalog-mongodb:
    image: mongo:8.0.29
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${FCG_MONGODB_ROOT_PASSWORD:-fcg-local-mongo-root}"
      MONGO_INITDB_DATABASE: FiapCloudGamesCatalog
      FCG_MONGODB_PASSWORD: "${FCG_MONGODB_PASSWORD:-fcg-local-mongo}"
    volumes:
      - catalog-mongodb-data:/data/db
      - ./mongodb/init-catalog.js:/docker-entrypoint-initdb.d/init-catalog.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username root --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fcg-network

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - fcg-network

  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki/docker.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - fcg-network

  docker-logs-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - docker-logs-network

  alloy:
    image: grafana/alloy:v1.19.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      FCG_COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME}"
    volumes:
      - ./observability/alloy/docker.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET /-/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r line <&3; [[ "$$line" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      loki:
        condition: service_started
      docker-logs-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - fcg-network
      - docker-logs-network

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${FCG_GRAFANA_PASSWORD:-fcg-local-grafana}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - fcg-network

  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "kong"
      POSTGRES_USER: "kong"
      POSTGRES_PASSWORD: "kong-local-password"
    volumes:
      - kong-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fcg-network

  kong-migrations:
    image: kong:3.9.3
    command:
      - /bin/sh
      - -c
      - kong migrations bootstrap || (kong migrations up && kong migrations finish)
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "kong-database"
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: "kong"
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "kong-local-password"
    depends_on:
      kong-database:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  kong:
    image: kong:3.9.3
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "kong-database"
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: "kong"
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "kong-local-password"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
      KONG_ADMIN_GUI_API_URL: "http://localhost:8001"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      users-api:
        condition: service_started
      catalog-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fcg-network

  kong-configure:
    image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    command: ["pwsh", "-NoProfile", "-File", "/config/configure-kong.ps1", "-AdminUrl", "http://kong:8001"]
    environment:
      FCG_JWT_SECRET: "fiap-cloud-games-local-development-secret-key"
    volumes:
      - ./kong:/config:ro
    depends_on:
      kong:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  users-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fcg@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - users-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - fcg-network

  catalog-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fcg@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - catalog-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - fcg-network

  users-api-migrator:
    build:
      context: ../fiap-cloud-games-users-api
      dockerfile: Dockerfile
    image: maicaoxd/fiap-cloud-games-users-api:0.2.1
    command: ["dotnet", "UsersAPI.dll", "--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=users-sqlserver,1433;Database=FiapCloudGamesUsers;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      users-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  catalog-api-migrator:
    build:
      context: ../fiap-cloud-games-catalog-api
      dockerfile: Dockerfile
    image: maicaoxd/fiap-cloud-games-catalog-api:0.4.1
    command: ["dotnet", "CatalogAPI.dll", "--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=catalog-sqlserver,1433;Database=FiapCloudGamesCatalog;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      catalog-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  users-api:
    build:
      context: ../fiap-cloud-games-users-api
      dockerfile: Dockerfile
    image: maicaoxd/fiap-cloud-games-users-api:0.2.1
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Api__UseDeveloperExceptionPage: "false"
      ConnectionStrings__DefaultConnection: "Server=users-sqlserver,1433;Database=FiapCloudGamesUsers;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      users-api-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  catalog-api:
    build:
      context: ../fiap-cloud-games-catalog-api
      dockerfile: Dockerfile
    image: maicaoxd/fiap-cloud-games-catalog-api:0.4.1
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Api__UseDeveloperExceptionPage: "false"
      Redis__Enabled: "true"
      Redis__Configuration: "catalog-redis:6379"
      Redis__Password: "${FCG_REDIS_PASSWORD:-fcg-local-redis}"
      MongoDb__ConnectionString: "mongodb://catalog-mongodb:27017"
      MongoDb__Username: "fcg-catalog"
      MongoDb__Password: "${FCG_MONGODB_PASSWORD:-fcg-local-mongo}"
      MongoDb__DatabaseName: "FiapCloudGamesCatalog"
      MongoDb__CollectionName: "game_details"
      MongoDb__OperationTimeoutSeconds: "2"
      ConnectionStrings__DefaultConnection: "Server=catalog-sqlserver,1433;Database=FiapCloudGamesCatalog;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      catalog-api-migrator:
        condition: service_completed_successfully
      catalog-mongodb:
        condition: service_healthy
      catalog-redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  payments-api:
    build:
      context: ../fiap-cloud-games-payments-api
      dockerfile: Dockerfile
    image: maicaoxd/fiap-cloud-games-payments-api:0.1.1
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      PaymentSimulation__DefaultStatus: "Approved"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  notifications-api:
    profiles: ["legacy-notifications"]
    build:
      context: ../fiap-cloud-games-notifications-api
      dockerfile: Dockerfile
    image: maicaoxd/fiap-cloud-games-notifications-api:0.1.2
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

volumes:
  loki-data:
  alloy-data:
  azurite-data:
  catalog-mongodb-data:
  prometheus-data:
  grafana-data:
  kong-postgres-data:
  users-sqlserver-data:
  catalog-sqlserver-data:

networks:
  docker-logs-network:
    internal: true
    driver: bridge
  fcg-network:
    driver: bridge
