services:
  catalog-mongodb:
    image: mongo:8.0.29
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${FCG_MONGODB_ROOT_PASSWORD:-fcg-local-mongo-root}"
      MONGO_INITDB_DATABASE: FiapCloudGamesCatalog
      FCG_MONGODB_PASSWORD: "${FCG_MONGODB_PASSWORD:-fcg-local-mongo}"
    volumes:
      - catalog-mongodb-data:/data/db
      - ./mongodb/init-catalog.js:/docker-entrypoint-initdb.d/init-catalog.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username root --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fcg-network

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - fcg-network

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${FCG_GRAFANA_PASSWORD:-fcg-local-grafana}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fcg-network

  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "kong"
      POSTGRES_USER: "kong"
      POSTGRES_PASSWORD: "kong-local-password"
    volumes:
      - kong-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fcg-network

  kong-migrations:
    image: kong:3.9.3
    command:
      - /bin/sh
      - -c
      - kong migrations bootstrap || (kong migrations up && kong migrations finish)
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "kong-database"
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: "kong"
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "kong-local-password"
    depends_on:
      kong-database:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  kong:
    image: kong:3.9.3
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "kong-database"
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: "kong"
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "kong-local-password"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
      KONG_ADMIN_GUI_API_URL: "http://localhost:8001"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - fcg-network

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fcg-network

  users-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fcg@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - users-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - fcg-network

  catalog-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fcg@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - catalog-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - fcg-network

  users-api-migrator:
    build:
      context: ../fiap-cloud-games-users-api
      dockerfile: Dockerfile
    image: fiap-cloud-games-users-api:local
    command: ["dotnet", "UsersAPI.dll", "--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=users-sqlserver,1433;Database=FiapCloudGamesUsers;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      users-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  catalog-api-migrator:
    build:
      context: ../fiap-cloud-games-catalog-api
      dockerfile: Dockerfile
    image: fiap-cloud-games-catalog-api:local
    command: ["dotnet", "CatalogAPI.dll", "--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=catalog-sqlserver,1433;Database=FiapCloudGamesCatalog;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      catalog-sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"
    networks:
      - fcg-network

  users-api:
    build:
      context: ../fiap-cloud-games-users-api
      dockerfile: Dockerfile
    image: fiap-cloud-games-users-api:local
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Api__UseDeveloperExceptionPage: "false"
      ConnectionStrings__DefaultConnection: "Server=users-sqlserver,1433;Database=FiapCloudGamesUsers;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      users-api-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  catalog-api:
    build:
      context: ../fiap-cloud-games-catalog-api
      dockerfile: Dockerfile
    image: fiap-cloud-games-catalog-api:local
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      Api__UseDeveloperExceptionPage: "false"
      MongoDb__ConnectionString: "mongodb://catalog-mongodb:27017"
      MongoDb__Username: "fcg-catalog"
      MongoDb__Password: "${FCG_MONGODB_PASSWORD:-fcg-local-mongo}"
      MongoDb__DatabaseName: "FiapCloudGamesCatalog"
      MongoDb__CollectionName: "game_details"
      MongoDb__OperationTimeoutSeconds: "2"
      ConnectionStrings__DefaultConnection: "Server=catalog-sqlserver,1433;Database=FiapCloudGamesCatalog;User Id=sa;Password=Fcg@123456;TrustServerCertificate=True;Encrypt=False"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      Jwt__Issuer: "FiapCloudGames"
      Jwt__Audience: "FiapCloudGames"
      Jwt__Secret: "fiap-cloud-games-local-development-secret-key"
      Jwt__ExpirationMinutes: "60"
    depends_on:
      catalog-api-migrator:
        condition: service_completed_successfully
      catalog-mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  payments-api:
    build:
      context: ../fiap-cloud-games-payments-api
      dockerfile: Dockerfile
    image: fiap-cloud-games-payments-api:local
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      PaymentSimulation__DefaultStatus: "Approved"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

  notifications-api:
    build:
      context: ../fiap-cloud-games-notifications-api
      dockerfile: Dockerfile
    image: fiap-cloud-games-notifications-api:local
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__VirtualHost: "/"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - fcg-network

volumes:
  catalog-mongodb-data:
  prometheus-data:
  grafana-data:
  kong-postgres-data:
  users-sqlserver-data:
  catalog-sqlserver-data:

networks:
  fcg-network:
    driver: bridge
